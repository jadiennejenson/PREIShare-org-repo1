# .github/workflows/pr-ci.yml
# Scaffold only — typecheck/build/lint/test come in later steps.
# Match Node version and package manager to docs/ci/project-ci-inventory.md.

name: PR CI

on:
  pull_request:

jobs:
  ci:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Replace with the version from docs/ci/project-ci-inventory.md
          node-version: "20"
          # If inventory says npm and package-lock.json exists, caching helps installs:
          cache: npm

      - name: Install dependencies
        # Swap for pnpm/yarn install if the inventory says so
        run: npm ci